<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>SimC Web Interface</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 2rem;
            background-color: #1e1e1e;
            color: #f0f0f0;
        }

        .user-menu {
            position: absolute;
            top: 20px;
            right: 30px;
            display: inline-block;
        }

        .dropbtn {
            background-color: #2a2a2a;
            color: #ffcc00;
            padding: 10px 20px;
            font-size: 16px;
            border: 1px solid #444;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .dropbtn:hover {
            background-color: #333;
        }

        .dropdown-content {
            display: none;
            position: absolute;
            right: 0;
            background-color: #2a2a2a;
            min-width: 200px;
            box-shadow: 0px 8px 16px 0px rgba(0, 0, 0, 0.5);
            border: 1px solid #444;
            border-radius: 4px;
            z-index: 1;
            padding: 15px;
            margin-top: 5px;
        }

        .show {
            display: block;
        }

        #login-form input {
            width: 100%;
            padding: 8px;
            margin: 5px 0;
            box-sizing: border-box;
            background-color: #111;
            border: 1px solid #555;
            color: white;
            border-radius: 3px;
        }

        #login-form button {
            width: 100%;
            background-color: #ffcc00;
            color: white;
            padding: 8px;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            margin-top: 10px;
            font-weight: bold;
        }

        #login-form button:hover {
            background-color: #ffcc00;
        }

        #login-form a {
            display: block;
            text-align: center;
            margin-top: 10px;
            color: #ccc;
            font-size: 0.9em;
            text-decoration: none;
        }

        #login-form a:hover {
            color: #ffcc00;
            text-decoration: underline;
        }

        h1 {
            color: #ffcc00;
        }

        textarea {
            background-color: #111;
            border: 1px solid #444;
            color: #ccc;
            padding: 10px;
            width: 100%;
            max-width: 800px;
        }

        button[type="submit"] {
            padding: 10px 20px;
            background-color: #ffcc00;
            color: #000;
            border: none;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        button[type="submit"]:hover {
            background-color: #e6b800;
        }
    </style>
</head>

<body>

    <div id="user-menu-placeholder"></div>

    <h1>SimC Simulation</h1>

    <form id="sim-form">
        <label for="input_content">SimC input:</label><br>
        <textarea id="input_content" name="input_content" rows="20"></textarea><br>
        <br>
        <button type="submit" value="quicksim">Quick Sim</button>
        <button type="submit" value="topgear">Top Gear</button>
    </form>

    <p id="result"></p>

    <script>
        function toggleLogin() {
            const dropdown = document.getElementById("myDropdown");
            if (dropdown) {
                dropdown.classList.toggle("show");
            }
        }

        window.onclick = function (event) {
            if (!event.target.matches('.dropbtn') && !event.target.closest('.dropdown-content')) {
                var dropdowns = document.getElementsByClassName("dropdown-content");
                for (var i = 0; i < dropdowns.length; i++) {
                    var openDropdown = dropdowns[i];
                    if (openDropdown.classList.contains('show')) {
                        openDropdown.classList.remove('show');
                    }
                }
            }
        }

        const form = document.getElementById('sim-form');
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const action = e.submitter ? e.submitter.value : 'quicksim';
            const inputContent = document.getElementById('input_content').value;
            const data = new URLSearchParams();
            data.append('input_content', inputContent);

            let endpoint = '/quicksim/run';
            if (action === 'topgear') { endpoint = '/topgear'; }

            try {
                const response = await fetch(endpoint, {
                    method: 'POST',
                    body: data,
                    redirect: "follow"
                });
                if (response.redirected) {
                    window.location.href = response.url;
                } else if (response.ok) {
                    const htmlText = await response.text();
                    document.open(); document.write(htmlText); document.close();
                } else {
                    document.getElementById("result").innerText = "Error: " + response.statusText;
                }
            } catch (err) {
                console.error(err);
                document.getElementById("result").innerText = "Network Error";
            }
        });
    </script>
</body>

</html>
