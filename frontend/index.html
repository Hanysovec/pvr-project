<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>SimC Web Interface</title>
    <link rel="stylesheet" href="/assets/style.css">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 2rem;
            background-color: #1e1e1e;
            color: #f0f0f0;

            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        h1 {
            color: #ffcc00;
            margin-bottom: 20px;
        }

        #sim-form {
            background-color: #2a2a2a;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #444;

            width: 100%;
            max-width: 800px;
            box-sizing: border-box;
            text-align: left;
        }

        textarea {
            background-color: #111;
            border: 1px solid #444;
            color: #ccc;
            padding: 10px;
            width: 100%;
            box-sizing: border-box;
            font-family: 'Consolas', 'Monaco', monospace;
            resize: vertical;
        }

        button[type="submit"] {
            padding: 10px 20px;
            background-color: #ffcc00;
            color: #000;
            border: none;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            margin-right: 10px;
            border-radius: 4px;
            transition: background 0.2s;
        }

        button[type="submit"]:hover {
            background-color: #e6b800;
        }
    </style>
</head>

<body>
    {{HEADER}}
    <h1>SimC Simulation</h1>
    <form id="sim-form">
        <label for="input_content">SimC input:</label><br>
        <textarea id="input_content" name="input_content" rows="20"></textarea><br>
        <br>
        <button type="submit" value="quicksim">Quick Sim</button>
        <button type="submit" value="topgear">Top Gear</button>
    </form>

    <p id="result"></p>

    <script>
        const form = document.getElementById('sim-form');
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const action = e.submitter ? e.submitter.value : 'quicksim';
            const inputContent = document.getElementById('input_content').value;
            const data = new URLSearchParams();
            data.append('input_content', inputContent);

            let endpoint = '/quicksim/run';
            if (action === 'topgear') { endpoint = '/topgear'; }

            try {
                const response = await fetch(endpoint, {
                    method: 'POST',
                    body: data,
                    redirect: "follow"
                });
                if (response.redirected) {
                    window.location.href = response.url;
                } else if (response.ok) {
                    const htmlText = await response.text();
                    document.open(); document.write(htmlText); document.close();
                } else {
                    document.getElementById("result").innerText = "Error: " + response.statusText;
                }
            } catch (err) {
                console.error(err);
                document.getElementById("result").innerText = "Network Error";
            }
        });
    </script>
</body>

</html>
