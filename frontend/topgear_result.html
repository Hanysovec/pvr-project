<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Top Gear Results</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 2rem;
            background-color: #1e1e1e;
            color: #f0f0f0;
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            color: #ffcc00;
            text-align: center;
        }

        .status-container {
            background: #2a2a2a;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
            border: 1px solid #444;
        }

        .status-text {
            font-size: 1.2rem;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .progress-track {
            width: 100%;
            height: 20px;
            background: #444;
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: #ffcc00;
            transition: width 0.3s ease;
        }

        #result-container {
            display: none;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: #2a2a2a;
            border-radius: 8px;
            overflow: hidden;
        }

        th,
        td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #444;
        }

        th {
            background-color: #333;
            color: #ffcc00;
        }

        tr:hover {
            background-color: #383838;
        }

        .dps-val {
            font-weight: bold;
            color: #4CAF50;
            font-size: 1.1em;
        }

        .dps-diff {
            font-size: 0.9em;
            color: #aaa;
        }

        .negative {
            color: #f44336;
        }

        .item-list {
            font-size: 0.85em;
            color: #ccc;
        }

        .item-entry {
            margin-bottom: 2px;
        }

        .winner-row {
            background-color: #3d3d30;
            border-left: 4px solid #ffcc00;
        }
    </style>
</head>

<body>

    <h1>Top Gear Simulation: <small>{{ID}}</small></h1>

    <div id="status-box" class="status-container">
        <div id="status-text" class="status-text">Initializing...</div>
        <div class="progress-track">
            <div id="progress-bar" class="progress-bar"></div>
        </div>
    </div>

    <div id="result-container">
        <button onclick="window.location.href='/topgear'" style="margin-bottom:15px; padding:10px;">Back to
            Selection</button>
        <table>
            <thead>
                <tr>
                    <th width="5%">Rank</th>
                    <th width="15%">DPS</th>
                    <th width="80%">Selected Items</th>
                </tr>
            </thead>
            <tbody id="result-body"></tbody>
        </table>
    </div>

    <script>
        const simId = "{{ID}}";
        const statusBox = document.getElementById('status-box');
        const resultContainer = document.getElementById('result-container');
        const statusText = document.getElementById('status-text');
        const progressBar = document.getElementById('progress-bar');

        async function checkStatus() {
            try {
                let res = await fetch(`/quicksim/${simId}/status`);
                let json = await res.json();

                if (json.status === "Processing" && json.progress_total) {
                    const pct = Math.round((json.progress_current / json.progress_total) * 100);
                    statusText.textContent = `Processing combination ${json.progress_current} of ${json.progress_total} (${pct}%)`;
                    progressBar.style.width = pct + "%";
                    setTimeout(checkStatus, 2000);
                }
                else if (json.status === "Finished") {
                    statusText.textContent = "Simulation Complete!";
                    progressBar.style.width = "100%";
                    setTimeout(fetchResult, 500);
                }
                else if (json.status === "Failed") {
                    statusText.textContent = "Failed: " + json.error;
                    statusText.style.color = "red";
                }
                else {
                    statusText.textContent = "Status: " + json.status;
                    setTimeout(checkStatus, 1000);
                }
            } catch (e) {
                console.error(e);
            }
        }

        async function fetchResult() {
            let res = await fetch(`/topgear/${simId}/data`);

            if (res.ok) {
                let json = await res.json();

                if (json.results) {
                    renderTable(json.results);

                    statusBox.style.display = 'none';
                    resultContainer.style.display = 'block';
                } else if (json.error) {
                    statusText.textContent = "Error: " + json.error;
                    statusText.style.color = "red";
                }
            }
        }

        function renderTable(results) {
            const tbody = document.getElementById('result-body');
            if (!results || results.length === 0) return;

            const maxDps = results[0].dps;

            results.forEach((row, index) => {
                const tr = document.createElement('tr');
                if (index === 0) tr.classList.add('winner-row');

                const tdRank = document.createElement('td');
                tdRank.textContent = index + 1;

                const tdDps = document.createElement('td');
                const diff = row.dps - maxDps;
                const diffText = diff === 0 ? "" : Math.round(diff);
                const diffClass = diff < 0 ? "negative" : "";

                tdDps.innerHTML = `
                    <div class="dps-val">${Math.round(row.dps).toLocaleString()}</div>
                    <div class="dps-diff ${diffClass}">${diffText}</div>
                `;

                const tdItems = document.createElement('td');
                tdItems.className = "item-list";

                let itemsHtml = "";
                row.items.forEach(line => {
                    let displayText = line.substring(0, 50) + "...";
                    itemsHtml += `<div class="item-entry">${line}</div>`;
                });
                tdItems.innerHTML = itemsHtml;

                tr.appendChild(tdRank);
                tr.appendChild(tdDps);
                tr.appendChild(tdItems);
                tbody.appendChild(tr);
            });
        }

        checkStatus();
    </script>
</body>

</html>
