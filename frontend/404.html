<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>404 - Page Not Found</title>
    <link rel="stylesheet" href="/assets/style.css">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }

        .container {
            max-width: 600px;
        }

        h1 {
            font-size: 8rem;
            margin: 0;
            color: #ff4444;
        }

        h2 {
            color: #ffcc00;
            margin-bottom: 20px;
        }

        p {
            color: #888;
            font-size: 1.2rem;
        }

        a {
            display: inline-block;
            margin-top: 30px;
            padding: 10px 30px;
            background: #ffcc00;
            color: black;
            text-decoration: none;
            font-weight: bold;
            border-radius: 4px;
        }

        a:hover {
            background: #e6b800;
        }
    </style>
</head>

<body>
    <div class="container">
        <img src="https://media2.giphy.com/media/v1.Y2lkPTZjMDliOTUyaDR6NnYzdGJsbGRhMWQyejNwZzc4aHNuZTd3ajB0b2k5c28yMzliZiZlcD12MV9naWZzX3NlYXJjaCZjdD1n/qZgHBlenHa1zKqy6Zn/200w.gif"
            alt="Lost" class="error-gif">
        <h1>404</h1>
        <h2>Oops! Lost in the Nether?</h2>
        <p>The page you are looking for doesn't exist or has been moved.</p>
        <a href="/">Back to Main menu</a>
    </div>
</body>

</html>
