<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>User Profile</title>
    <link rel="stylesheet" href="/style.css">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 2rem;
            background-color: #1e1e1e;
            color: #f0f0f0;
            max-width: 1000px;
            margin: 0 auto;
        }

        h1 {
            color: #ffcc00;
            margin-bottom: 5px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            border-bottom: 1px solid #444;
            padding-bottom: 20px;
            margin-bottom: 30px;
        }

        .user-info p {
            margin: 5px 0;
            color: #aaa;
        }

        .role-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: bold;
            border: 1px solid transparent;
            font-size: 0.9em;
            background-color: #333;
            color: #ccc;
        }

        .role-container.Admin .role-badge {
            color: #ff4444;
            border-color: #ff4444;
            background-color: rgba(255, 68, 68, 0.1);
        }

        .role-container.Premium .role-badge {
            color: #ffcc00;
            border-color: #ffcc00;
            background-color: rgba(255, 204, 0, 0.1);
        }

        .role-container.User {
            display: none;
        }

        .logout-btn {
            background-color: #d32f2f;
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 4px;
            font-weight: bold;
            transition: background 0.3s;
        }

        .logout-btn:hover {
            background-color: #b71c1c;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background-color: #2a2a2a;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        th,
        td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #444;
        }

        th {
            background-color: #333;
            color: #ffcc00;
            text-transform: uppercase;
            font-size: 0.85em;
            letter-spacing: 1px;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover {
            background-color: #303030;
        }

        .dps-val {
            font-weight: bold;
            color: #4CAF50;
        }

        .sim-type {
            font-weight: bold;
            color: #ddd;
        }
    </style>
</head>

<body>
    <div class="header">
        <div class="user-info">
            <a href="/" class="back-btn">Back to Main menu</a>
            <h1>{{USERNAME}}</h1>
            <p class="role-container {{ROLE}}">
                <span class="role-badge">{{ROLE}}</span>
            </p>
        </div>

        <a href="/user/logout" class="logout-btn">Log Out</a>
    </div>

    <h2 style="color: #ccc;">Recent Simulations</h2>

    <table>
        <thead>
            <tr>
                <th>Type</th>
                <th>Date</th>
                <th>DPS</th>
                <th>ID</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody>
            {{HISTORY_ROWS}}
        </tbody>
    </table>

</body>

</html>
