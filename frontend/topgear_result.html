<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Top Gear Results</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 2rem;
            background-color: #1e1e1e;
            color: #f0f0f0;
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            color: #ffcc00;
            text-align: center;
        }

        .status-container {
            background: #2a2a2a;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
            border: 1px solid #444;
        }

        .status-text {
            font-size: 1.2rem;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .progress-track {
            width: 100%;
            height: 20px;
            background: #444;
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: #ffcc00;
            transition: width 0.3s ease;
        }

        #result-container {
            display: none;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: #2a2a2a;
            border-radius: 8px;
            overflow: hidden;
        }

        th,
        td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #444;
        }

        th {
            background-color: #333;
            color: #ffcc00;
        }

        tr:hover {
            background-color: #383838;
        }

        .dps-val {
            font-weight: bold;
            color: #4CAF50;
            font-size: 1.1em;
        }

        .dps-diff {
            font-size: 0.9em;
            color: #aaa;
        }

        .negative {
            color: #f44336;
        }

        .item-list {
            font-size: 0.85em;
            color: #ccc;
        }

        .item-entry {
            margin-bottom: 2px;
        }

        .winner-row {
            background-color: #3d3d30;
            border-left: 4px solid #ffcc00;
        }

        .items-flex {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .item-icon-wrapper {
            position: relative;
            width: 40px;
            height: 40px;
            display: inline-block;
        }

        .item-icon-img {
            width: 100%;
            height: 100%;
            border-radius: 4px;
            border: 1px solid #444;
            background-color: #111;
        }

        #wowhead-tooltip-container {
            position: fixed;
            display: none;
            z-index: 10000;

            background-color: #050505;
            border: 1px solid #777;
            border-radius: 4px;
            padding: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.8);

            color: #ffffff;
            font-size: 12px;
            line-height: 1.4;
            text-align: left;
            max-width: 320px;
            pointer-events: none;
        }

        #wowhead-tooltip-container table {
            width: 100%;
            background: transparent;
            border: none;
            border-collapse: collapse;
        }

        #wowhead-tooltip-container td,
        #wowhead-tooltip-container th {
            border: none;
            padding: 0;
            background: transparent;
            color: white;
            text-align: left;
        }

        .q {
            color: #ffd100;
        }

        .q0 {
            color: #9d9d9d;
        }

        .q1 {
            color: #ffffff;
        }

        .q2 {
            color: #1eff00;
        }

        .q3 {
            color: #0070dd;
        }

        .q4 {
            color: #a335ee;
        }

        .q5 {
            color: #ff8000;
        }

        #wowhead-tooltip-container a {
            text-decoration: none;
            color: inherit;
        }

        .moneygold {
            color: gold;
        }

        .moneysilver {
            color: silver;
        }

        .moneycopper {
            color: #cd7f32;
        }

        #wowhead-tooltip-container span[class*="socket-"] {
            display: block !important;
            width: auto !important;
            height: auto !important;
            min-height: 16px;
            padding-left: 20px !important;
            background-repeat: no-repeat !important;
            background-position: left center !important;
            background-size: 16px 16px !important;
            margin-top: 2px;
            color: #ddd;
        }
    </style>
</head>

<body>

    <h1>Top Gear Simulation: <small>{{ID}}</small></h1>
    <div id="wowhead-tooltip-container"></div>
    <div id="status-box" class="status-container">
        <div id="status-text" class="status-text">Initializing...</div>
        <div class="progress-track">
            <div id="progress-bar" class="progress-bar"></div>
        </div>
    </div>

    <div id="result-container">
        <button onclick="window.location.href='/topgear'" style="margin-bottom:15px; padding:10px;">Back to
            Selection</button>
        <table>
            <thead>
                <tr>
                    <th width="5%">Rank</th>
                    <th width="15%">DPS</th>
                    <th width="80%">Selected Items</th>
                </tr>
            </thead>
            <tbody id="result-body"></tbody>
        </table>
    </div>

    <script>
        const simId = "{{ID}}";
        const statusBox = document.getElementById('status-box');
        const resultContainer = document.getElementById('result-container');
        const statusText = document.getElementById('status-text');
        const progressBar = document.getElementById('progress-bar');
        const tooltipBox = document.getElementById('wowhead-tooltip-container');
        const iconCache = {};

        async function checkStatus() {
            try {
                let res = await fetch(`/quicksim/${simId}/status`);
                let json = await res.json();

                if (json.status === "Processing" && json.progress_total) {
                    const pct = Math.round((json.progress_current / json.progress_total) * 100);
                    statusText.textContent = `Processing combination ${json.progress_current} of ${json.progress_total} (${pct}%)`;
                    progressBar.style.width = pct + "%";
                    setTimeout(checkStatus, 2000);
                }
                else if (json.status === "Finished") {
                    statusText.textContent = "Simulation Complete!";
                    progressBar.style.width = "100%";
                    setTimeout(fetchResult, 500);
                }
                else if (json.status === "Failed") {
                    statusText.textContent = "Failed: " + json.error;
                    statusText.style.color = "red";
                }
                else {
                    statusText.textContent = "Status: " + json.status;
                    setTimeout(checkStatus, 1000);
                }
            } catch (e) {
                console.error(e);
            }
        }

        async function fetchResult() {
            let res = await fetch(`/topgear/${simId}/data`);

            if (res.ok) {
                let json = await res.json();

                if (json.results) {
                    renderTable(json.results);

                    statusBox.style.display = 'none';
                    resultContainer.style.display = 'block';
                } else if (json.error) {
                    statusText.textContent = "Error: " + json.error;
                    statusText.style.color = "red";
                }
            }
        }

        function renderTable(results) {
            const tbody = document.getElementById('result-body');
            if (!results || results.length === 0) return;

            const maxDps = results[0].dps;

            results.forEach((row, index) => {
                const tr = document.createElement('tr');
                if (index === 0) tr.classList.add('winner-row');

                const tdRank = document.createElement('td');
                tdRank.textContent = index + 1;

                const tdDps = document.createElement('td');
                const diff = row.dps - maxDps;
                const diffText = diff === 0 ? "" : Math.round(diff).toLocaleString();
                const diffClass = diff < 0 ? "negative" : "";
                tdDps.innerHTML = `
                    <div class="dps-val">${Math.round(row.dps).toLocaleString()}</div>
                    <div class="dps-diff ${diffClass}">${diffText}</div>
                `;

                const tdItems = document.createElement('td');
                const itemsDiv = document.createElement('div');
                itemsDiv.className = 'items-flex';

                row.items.forEach(line => {
                    const parsed = parseSimcLine(line);

                    if (parsed && parsed.id) {
                        const wrapper = document.createElement('div');
                        wrapper.className = 'item-icon-wrapper';

                        const img = document.createElement('img');
                        img.className = 'item-icon-img';
                        img.src = "https://render.worldofwarcraft.com/eu/icons/56/inv_misc_questionmark.jpg";
                        // OPTIMALIZATION to let server breathe
                        if (iconCache[parsed.id]) {
                            img.src = iconCache[parsed.id];
                        } else {
                            img.src = "https://render.worldofwarcraft.com/eu/icons/56/inv_misc_questionmark.jpg";
                            fetch(`/api/item_icon/${parsed.id}`)
                                .then(r => r.json())
                                .then(d => {
                                    if (d.icon_url) {
                                        img.src = d.icon_url;
                                        iconCache[parsed.id] = d.icon_url;
                                    }
                                });
                        }

                        wrapper.addEventListener('mouseenter', (e) => showTooltip(e, parsed));
                        wrapper.addEventListener('mousemove', moveTooltip);
                        wrapper.addEventListener('mouseleave', hideTooltip);

                        wrapper.appendChild(img);
                        itemsDiv.appendChild(wrapper);
                    }
                });

                tdItems.appendChild(itemsDiv);
                tr.appendChild(tdRank);
                tr.appendChild(tdDps);
                tr.appendChild(tdItems);
                tbody.appendChild(tr);
            });
        }

        function parseSimcLine(line) {
            const idMatch = line.match(/id=(\d+)/);
            const bonusMatch = line.match(/bonus_id=([0-9/]+)/);
            const enchantMatch = line.match(/enchant_id=(\d+)/);
            const gemMatch = line.match(/gem_id=([0-9/]+)/);

            if (!idMatch) return null;

            return {
                id: idMatch[1],
                bonus: bonusMatch ? bonusMatch[1] : null,
                enchant: enchantMatch ? enchantMatch[1] : null,
                gems: gemMatch ? gemMatch[1] : null
            };
        }

        async function showTooltip(e, data) {
            tooltipBox.innerHTML = "Loading...";
            tooltipBox.style.display = 'block';
            moveTooltip(e);

            const params = new URLSearchParams();
            params.append('item_id', data.id);
            if (data.bonus) params.append('bonus', data.bonus);
            if (data.enchant) params.append('enchant', data.enchant);
            if (data.gems) params.append('gems', data.gems);

            try {
                const res = await fetch(`/api/wowhead_tooltip?${params.toString()}`);
                const json = await res.json();

                if (json.tooltip) {
                    tooltipBox.innerHTML = json.tooltip;
                } else {
                    tooltipBox.innerHTML = "Tooltip not found";
                }
            } catch (err) {
                console.error(err);
                tooltipBox.innerHTML = "Error loading tooltip";
            }
        }

        function moveTooltip(e) {
            const x = e.clientX + 15;
            const y = e.clientY + 15;

            tooltipBox.style.left = x + 'px';
            tooltipBox.style.top = y + 'px';
        }

        function hideTooltip() {
            tooltipBox.style.display = 'none';
        }

        checkStatus();
    </script>
</body>

</html>
